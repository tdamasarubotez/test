<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PolyTrack</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <iframe 
        id="polytrack-game"
        src="https://www.crazygames.com/embed/polytrack" 
        importance="high"
        sandbox="allow-scripts allow-same-origin allow-top-navigation allow-popups allow-popups-to-escape-sandbox allow-pointer-lock allow-downloads" 
        allow="autoplay; fullscreen; vr; xr-spatial-tracking; clipboard-write; gamepad *;">
        Error: Your browser does not support iframes.
    </iframe>

    <script>
        // Automatically focus the game so controls work instantly
        window.addEventListener("DOMContentLoaded", function() {
            var iframe = document.getElementById("polytrack-game");
            if (iframe) {
                iframe.focus();
            }
        });
    </script>
</body>
</html>
